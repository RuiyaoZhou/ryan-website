project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    - math.qmd
    - blog.qmd
    - about.qmd
    - "posts/**/*.qmd"
    - "!posts/welcome/**"
    - "!posts/post-with-code/**"
  resources:
    - files/*.pdf

website:
  description: "Mathematics, expository writing, and a blog by Ruiyao Zhou."
  site-url: https://ruiyaozhou.github.io/ryan-website/
  title: "Ruiyao Zhou"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: math.qmd
        text: Math
      - href: blog.qmd
        text: Blog
    right:
      - icon: github
        href: https://github.com/RuiyaoZhou
        aria-label: GitHub
  page-footer:
    left: "Ruiyao Zhou"
    right:
      - text: Contact
        href: mailto:rz1323@ic.ac.uk

lang: en-GB

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: false
